name: CI

on:
  push:
  pull_request:
    branches: [main]

# A push to a branch with an open PR would otherwise trigger two identical runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # vitest requires >=22.12 and jsdom >=24.15 on the 24.x line.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the API route tests, which run against an in-process Postgres (PGlite) — no services needed.
      - name: Unit, component, integration and API tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        # Server secrets are read lazily at request time, so the build needs none of them. The bucket
        # host is optional too (an unset one just allows no remote images), e.g. on fork PRs.
        env:
          NEXT_PUBLIC_S3_BUCKET_URL: ${{ secrets.NEXT_PUBLIC_S3_BUCKET_URL }}

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds into .next-e2e against a mocked API origin; no secrets needed.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
